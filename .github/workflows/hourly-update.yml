name: Hourly Profile Update

on:
  schedule:
    # Try on the hour, with fallback attempts if GitHub misses a schedule.
    - cron: '0,20,40 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-profile-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'AnggaTechI/AnggaTechI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Update profile timestamp
        shell: bash
        env:
          GIT_AUTHOR_NAME: AnggaTechI
          GIT_AUTHOR_EMAIL: 276389265+AnggaTechI@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          updated_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # Fallback runs must not create another commit in the same UTC hour.
          last_update="$(cat LAST_UPDATE 2>/dev/null || true)"
          if [[ "${last_update:0:13}" == "${updated_at:0:13}" ]]; then
            echo "This UTC hour already has an update: $last_update"
            exit 0
          fi
          printf '%s\n' "$updated_at" > LAST_UPDATE
          git add -- LAST_UPDATE
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: hourly profile update [$updated_at]"
          git pull --rebase origin main
          git push origin HEAD:main
